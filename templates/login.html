{% extends "base.html" %}
{% block titulo %}Entrar · Painel SGF{% endblock %}
{% block corpo %}
<main class="login">
  <form class="card" method="post">
    <h1>Painel financeiro SGF</h1>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuário</label>
    <input name="login" autocomplete="username" required value="{{ login }}">
    <label>Senha</label>
    <input name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p>Ao entrar, a consulta dos dados é feita de novo.</p>
  </form>
</main>
{% endblock %}
