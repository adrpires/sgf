<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Painel SGF{% endblock %}</title>
<style>
  :root { --bg:#f3f6fb; --ink:#102033; --muted:#5c6b80; --line:#d7e0ec; --accent:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 16px; background:#102033; color:#fff; }
  header a { color:#fff; text-decoration:none; }
  header span { display:flex; gap:14px; align-items:center; }
  main { max-width:880px; margin:0 auto; padding:24px; }
  h1 { font-size:22px; margin:0 0 16px; }
  form.card, .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; margin:12px 0 4px; color:var(--muted); font-size:13px; }
  input, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; background:#fff; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .check input { width:auto; }
  button, .botao { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-block; margin-top:16px; }
  button.claro { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .erro { background:#fde8e6; border:1px solid #f3b4ae; border-radius:8px; padding:8px 10px; margin-bottom:12px; }
  .aviso { background:#e7f6ee; border:1px solid #9ad7b8; border-radius:8px; padding:8px 10px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .login { max-width:420px; margin:12vh auto; padding:24px; }
</style>
</head>
<body>
{% block corpo %}{% endblock %}
</body>
</html>
