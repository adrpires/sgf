{% extends "base.html" %}
{% block titulo %}Senha · Painel SGF{% endblock %}
{% block titulo_pagina %}Alterar senha{% endblock %}
{% block corpo %}
<main>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  {% if aviso %}<div class="aviso">{{ aviso }}</div>{% endif %}
  <form class="card" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Senha atual</label>
    <input name="atual" type="password" autocomplete="current-password" required>
    <label>Nova senha</label>
    <input name="senha" type="password" autocomplete="new-password" required>
    <label>Confirmar nova senha</label>
    <input name="confirmar" type="password" autocomplete="new-password" required>
    <button type="submit">Salvar</button>
  </form>
</main>
{% endblock %}
