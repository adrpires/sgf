services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${GEFIN_PORT:-8096}:443"
    environment:
      GEFIN_SSL_CN: ${GEFIN_SSL_CN:-apsitelecom.com.br}
    volumes:
      - ./certs:/certs-in:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    env_file: .env
    environment:
      GEFIN_PAINEL: /data/painel_sgf.html
      GEFIN_DB: /usuarios/usuarios.db
      GEFIN_COOKIE_SECURE: "1"
    volumes:
      - painel:/data:ro
      - usuarios:/usuarios

  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SGF_OUT: /data/painel_sgf.html
      SGF_NO_SANDBOX: "1"
    volumes:
      - painel:/data
    shm_size: 1gb
    depends_on:
      - web

volumes:
  painel:
  usuarios:
